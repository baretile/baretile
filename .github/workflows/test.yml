# For every pull request and every push to main: build and check the wheel on Python 3.12 to 3.14, run ruff and the
# test suite on ttsim, and alongside them the kernel tests and the whole suite on ttsim-chaos. A job that runs the whole
# suite runs it in a pytest-xdist worker for each of the runner's CPUs, with NumPy on one thread each. The suite on ttsim
# includes the adapter tests, on the tinygrad commit pinned below. Tests that need checkpoints, PyTorch, transformers or
# tiktoken skip themselves here. A pull request's branch runs once, as the pull request, and a newer push to it cancels
# the run still going. The card job runs the bring-up stages on a P150a, once a runner for it exists (docs/bring-up.md).
name: test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      # Build the wheel from the sdist, then import it without the checkout on sys.path.
      - run: python -m build
      - run: python -m pip install dist/*.whl
      # baretile needs nothing outside the standard library. The models extra adds NumPy for the models and the server
      - name: Check the installed package and its visualization template
        run: |
          python -I - <<'PY'
          from importlib import metadata, resources
          from baretile import chip, kernels, pci, runtime, tensor, tensix, viz
          assert all("extra ==" in r for r in metadata.requires("baretile")), metadata.requires("baretile")
          assert "<canvas" in resources.files("baretile").joinpath("viz.html").read_text()
          PY
      - run: python -m pip install "$(ls dist/*.whl)[models]"
      - name: Check the installed models and server
        run: |
          python -I -c "from baretile.models import cost, gpt2, llama, qwen, serve, train"
          python -I -m baretile.models.serve 2>&1 | grep -q "usage"
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clang, lld and the Python packages
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy pytest pytest-xdist ruff
      # The two-chip library that test_two_chips copies a tensor between. The one-chip library comes from
      # baretile.chip ttsim below, as it does for someone trying baretile
      - name: Download two-chip ttsim
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.11.5 --repo tenstorrent/ttsim --pattern libttsim_bh_x2.so --dir "$RUNNER_TEMP/ttsim"
      # The adapter calls tinygrad's internal APIs, so its tests run on this tinygrad commit. Move the pin and the
      # adapter together.
      - name: Check out tinygrad
        run: |
          git init -q "$RUNNER_TEMP/tinygrad"
          git -C "$RUNNER_TEMP/tinygrad" fetch -q --depth 1 https://github.com/tinygrad/tinygrad 002630241913a57abccf646b092878ec8a9b882f
          git -C "$RUNNER_TEMP/tinygrad" checkout -q FETCH_HEAD
      # test_kmd_layouts checks pci.Kmd's ioctl arguments against tt-kmd's header, from the 2.11.0 release
      - name: Download tt-kmd's ioctl.h
        run: curl --fail --location --silent --output "$RUNNER_TEMP/ioctl.h" https://raw.githubusercontent.com/tenstorrent/tt-kmd/c05f22460985960905928cf48b3fbde602d9ea37/ioctl.h
      # Compiled kernels are cached by their source, so a cache from an older commit only saves time.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/baretile
          key: kernels-${{ github.sha }}
          restore-keys: kernels-
      - run: python -m baretile.chip ttsim
      - run: python -m baretile.chip check
      - run: ruff check
      - run: python -m pytest -n auto --dist worksteal test
        env:
          OPENBLAS_NUM_THREADS: 1
          TTSIM2: ${{ runner.temp }}/ttsim/libttsim_bh_x2.so
          TINYGRAD: ${{ runner.temp }}/tinygrad
          KMD_IOCTL: ${{ runner.temp }}/ioctl.h
  # The comparisons with transformers, PyTorch, tiktoken and safetensors skip in the test job, which doesn't install
  # them. This job installs pinned versions and runs those tests, and SKIPS=fail turns a skip into a failure, so a
  # missing package can't pass for a green run. The PyTorch frontend also needs the pinned tinygrad.
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clang, lld and the Python packages
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest transformers==5.20.2 tiktoken==0.13.0 safetensors==0.8.0
      - name: Check out tinygrad
        run: |
          git init -q "$RUNNER_TEMP/tinygrad"
          git -C "$RUNNER_TEMP/tinygrad" fetch -q --depth 1 https://github.com/tinygrad/tinygrad 002630241913a57abccf646b092878ec8a9b882f
          git -C "$RUNNER_TEMP/tinygrad" checkout -q FETCH_HEAD
      - uses: actions/cache@v4
        with:
          path: ~/.cache/baretile
          key: kernels-references-${{ github.sha }}
          restore-keys: kernels-
      - run: python -m baretile.chip ttsim
      - run: >-
          python -m pytest -s -rs test/test_models.py::test_train test/test_models.py::test_train_gpt2 test/test_models.py::test_llama_frequencies
          test/test_models.py::test_tokenizer test/test_models.py::test_hf_families test/test_models.py::test_qwen3_moe
          test/test_models.py::test_qwen3_5_moe test/test_models.py::test_mxfp4 test/test_models.py::test_torch_frontend
        env:
          SKIPS: fail
          TINYGRAD: ${{ runner.temp }}/tinygrad
  # ttsim with test/ttsim-chaos.patch, built from the release the patch is for (docs/testing.md, "ttsim-chaos"). One
  # job runs the kernels with every kind of timing noise; the run number seeds it, so each run tries other timings.
  # ttsim-chaos prints the seed, and TTSIM_CHAOS_SEED=n repeats a failure. That takes one process, since the seed starts
  # a process's noise, and what each test sees follows from the tests before it. The other job runs the suite on all
  # 140 Tensix tiles, since a p150 reports 120 or 140 depending on its firmware. It has no noise, so it runs in workers.
  chaos:
    name: chaos (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: every setting
            key: noise
            tests: test/test_device.py test/test_kernels.py test/test_models.py::test_delta_step test/test_models.py::test_delta_pieces test/test_models.py::test_moe
              'test/test_models.py::test_ramp[4_kernel.py]'
            settings: TTSIM_CHAOS_NOC=1,400 TTSIM_CHAOS_RISCV=0.2 TTSIM_CHAOS_TENSIX=0.2 TTSIM_CHAOS_MATH=1,40
            flags: -s
          - name: 140 tiles
            key: unharvested
            tests: test
            settings: TTSIM_CHAOS_UNHARVESTED=1
            flags: -n auto --dist worksteal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clang, lld and the Python packages
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy pytest pytest-xdist
      - name: Build ttsim-chaos
        run: |
          git clone --depth 1 --branch v1.11.5 https://github.com/tenstorrent/ttsim "$RUNNER_TEMP/ttsim-chaos"
          cd "$RUNNER_TEMP/ttsim-chaos"
          git apply "$GITHUB_WORKSPACE/test/ttsim-chaos.patch"
          ./make.py src/_out/release_bh/libttsim.so
      - uses: actions/cache@v4
        with:
          path: ~/.cache/baretile
          key: kernels-${{ matrix.key }}-${{ github.sha }}
          restore-keys: kernels-
      - run: env ${{ matrix.settings }} TTSIM_CHAOS_SEED=${{ github.run_number }} python -m pytest ${{ matrix.flags }} ${{ matrix.tests }}
        env:
          OPENBLAS_NUM_THREADS: 1
          TTSIM: ${{ runner.temp }}/ttsim-chaos/src/_out/release_bh/libttsim.so
  # The bring-up stages on a P150a, from preflight through the model tests, on the self-hosted runner in the card's
  # machine. They run once a maintainer sets the repository variable CARD to true, and never for a pull request from a
  # fork: a self-hosted runner runs whatever the pull request's code does, with the machine's access. With the variable
  # SMOLLM naming a SmolLM-135M folder on that machine, its checkpoint stage runs too. The record is kept either way.
  card:
    if: vars.CARD == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, p150a]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pytest
      - name: Bring up the card and run the suite on it
        run: python test/bringup.py record --only preflight,chip,transfers,launches,math,kernels,models,smollm ${{ vars.SMOLLM && format('--smollm {0}', vars.SMOLLM) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bring-up-record
          path: record/
