<!doctype html>
<meta charset="utf-8">
<title>baretile viz</title>
<!-- viz.py puts the launches into the data script below and writes this out as one file. It needs no server and loads
nothing else. -->
<style>
  :root { color-scheme: dark; scrollbar-color: #3a3a3a #101010; --bg: #101010; --line: #2a2a2a; --text: #d8d8d8; --dim: #8a8a8a; --pick: #1e2a38; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto 128px 1fr; background: var(--bg); color: var(--text);
         font: 12px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  header { display: flex; gap: 18px; align-items: baseline; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  header b { font-size: 13px; }
  header b, #tabs { flex: none; }  /* only the summary wraps */
  header button { background: none; color: var(--dim); border: 1px solid var(--line); border-radius: 3px; font: inherit; cursor: pointer; }
  header button.on { color: var(--text); border-color: var(--dim); }
  .dim { color: var(--dim); }
  #timeline { width: 100%; height: 128px; display: block; border-bottom: 1px solid var(--line); cursor: grab; }
  main { display: grid; grid-template-columns: minmax(360px, 40%) 1fr; min-height: 0; }
  #kernels { overflow: auto; border-right: 1px solid var(--line); }
  table { border-collapse: collapse; width: 100%; }
  th { position: sticky; top: 0; background: var(--bg); color: var(--dim); font-weight: normal; }
  th, td { padding: 3px 10px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
  td:first-child i { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 2px; }
  tbody tr { cursor: pointer; } tbody tr:hover { background: #191919; } tbody tr.on { background: var(--pick); }
  #kernel { overflow: auto; padding: 12px 18px; }
  #kernel h2 { font-size: 13px; margin: 0 0 4px; word-break: break-all; }
  #kernel p { margin: 0 0 4px; }
  #kernel pre { margin: 14px 0 0; white-space: pre-wrap; word-break: break-all; color: var(--dim); }
  svg { display: block; margin-top: 14px; }
  svg text { fill: var(--text); font: 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-anchor: middle; }
  svg text.dim { fill: var(--dim); }
  svg path { fill: none; stroke: #555; }
  #tip { position: fixed; display: none; pointer-events: none; padding: 4px 8px; background: #000; border: 1px solid var(--line); }
</style>
<header><b>baretile viz</b><span id="tabs"></span><span id="summary"></span></header>
<canvas id="timeline"></canvas>
<main><div id="kernels"></div><div id="kernel"><p class="dim">This page draws itself with JavaScript. If this message stays, open the
file in a browser: previews often don't run scripts.</p></div></main>
<div id="tip"></div>
<script id="data" type="application/json">{data}</script>
<script>
const data = document.getElementById("data").textContent;  // a list from viz.py, or the placeholder in the template itself
const runs = data.startsWith("[") ? JSON.parse(data) : [], $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const num = n => n >= 1e9 ? (n / 1e9).toFixed(2) + "G" : n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e4 ? (n / 1e3).toFixed(1) + "k" : String(n);
const color = (k, a = 1) => `hsla(${k * 137.5 % 360}, 50%, 60%, ${a})`;  // golden-angle hues, so kernels next to each other differ
let run, picked, view;  // the runtime shown, the kernel picked, and the cycles [from, to] the timeline shows

function show(r) {
  run = runs[r]; picked = null;
  $("tabs").innerHTML = runs.length > 1 ? runs.map((u, i) => `<button class="${i == r ? "on" : ""}" onclick="show(${i})">${esc(u.title)}</button>`).join(" ") : esc(run.title);
  const [first, last] = [run.launches[0], run.launches.at(-1)], cycles = run.kernels.reduce((a, k) => a + k.cycles, 0);
  $("summary").innerHTML = (first ? `launches ${first[1]} to ${last[1]} of ${run.total}, ${run.kernels.length} kernels, ${num(cycles)} cycles` : "no finished launches") +
    (run.sim ? ` <span class="dim">· on ttsim, cycles count RISC-V work: Tensix instructions and NoC reads take no time</span>` : "");
  whole();
  const order = run.kernels.map((k, i) => i).sort((a, b) => run.kernels[b].cycles - run.kernels[a].cycles), bytes = run.kernels[0]?.bytes != null;
  $("kernels").innerHTML = `<table><thead><tr><th>kernel</th><th>launches</th><th>cycles</th><th>%</th>${bytes ? "<th>bytes read</th>" : ""}</tr></thead><tbody>` +
    order.map(i => { const k = run.kernels[i], inputs = k.graph ? k.graph.filter(n => !n[2].length).map(n => n[1]).join(" ") : "";  // kernels often share a name
      return `<tr id="k${i}" onclick="pick(${i})"><td title="${esc(k.name)} ${esc(inputs)}"><i style="background:${color(i)}"></i>${esc(k.name || "(no name)")} <span class="dim">${esc(inputs)}</span></td>` +
      `<td>${k.launches}</td><td>${num(k.cycles)}</td><td>${(100 * k.cycles / (cycles || 1)).toFixed(1)}</td>${bytes ? `<td>${num(k.bytes)}</td>` : ""}</tr>`; }).join("") + "</tbody></table>";
  order.length ? pick(order[0]) : ($("kernel").innerHTML = "", draw());
}

function pick(i) {
  if (picked != null) $(`k${picked}`)?.classList.remove("on");
  picked = i; $(`k${i}`).classList.add("on");
  const k = run.kernels[i], workers = new Set(run.launches.filter(l => l[0] == i).map(l => l[5]));
  let h = `<h2>${esc(k.name || "(no name)")}</h2><p>${k.launches} launch${k.launches > 1 ? "es" : ""} on ${[...workers].join(" or ")} worker${Math.max(...workers) > 1 ? "s" : ""}, ` +
    `${num(k.cycles)} cycles${k.bytes != null ? `, ${num(k.bytes)} bytes read` : ""}</p>`;
  if (k.graph) h += `<p class="dim">fused, computing in ${k.dtype}${k.out != k.dtype ? ` and writing ${k.out}` : ""}, in ${k.units} unit${k.units > 1 ? "s" : ""}</p>` + graph(k.graph);
  h += k.text ? `<pre>${esc(k.text)}</pre>` : `<p class="dim">launched with Runtime.launch, not made through tensor.py, so there's nothing more to show</p>`;
  $("kernel").innerHTML = h;
  draw();
}

// A fused expression, inputs at the top and the result at the bottom. A node's row is one below its lowest operand. An
// edge that skips rows passes through a point in each row between, so it goes around the nodes there instead of under
// them. In each row, nodes and points go under the mean of what they read and are pushed apart until they don't overlap.
function graph(nodes) {
  const CHAR = 7.2, H = 36, GAP = 18, ROW = H + 34;
  const row = [], items = nodes.map(([label, detail]) => ({ w: Math.max(label.length, detail.length) * CHAR + 20, reads: [] })), edges = [];
  nodes.forEach(([, , srcs], i) => {
    items[i].row = row[i] = srcs.length ? 1 + Math.max(...srcs.map(j => row[j])) : 0;
    for (const j of new Set(srcs)) {  // x * x is one edge
      const path = [j];
      for (let r = row[j] + 1; r < row[i]; r++) path.push(items.push({ w: 0, row: r, reads: [path.at(-1)] }) - 1);
      items[i].reads.push(path.at(-1));
      edges.push([...path, i]);
    }
  });
  const rows = [];
  items.forEach((it, k) => (rows[it.row] ??= []).push(k));
  for (const r of rows) {  // inputs all want 0, so they spread out from there in the order the expression reads them
    const want = k => items[k].reads.length ? items[k].reads.reduce((a, j) => a + items[j].x, 0) / items[k].reads.length : 0;
    // Items that would overlap form a block, which sits where its members want on average. Merging a block into the one
    // before it can make that one overlap the one before it in turn. An item that touches nothing stays where it wants,
    // so an edge's points line up and the edge is straight.
    const blocks = [];  // each is [items, their offsets from the first, sum of want minus offset]
    for (const k of [...r].sort((a, b) => want(a) - want(b))) {
      let b = [[k], [0], want(k)];
      for (let p; (p = blocks.at(-1)); ) {
        const d = p[1].at(-1) + items[p[0].at(-1)].w / 2 + GAP + items[b[0][0]].w / 2;  // where b starts in p, if they merge
        if (p[2] / p[0].length + d <= b[2] / b[0].length) break;
        b = [[...p[0], ...b[0]], [...p[1], ...b[1].map(o => o + d)], p[2] + b[2] - d * b[0].length];
        blocks.pop();
      }
      blocks.push(b);
    }
    for (const [ks, offsets, sum] of blocks) ks.forEach((k, n) => items[k].x = sum / ks.length + offsets[n]);
  }
  const left = Math.min(...items.map(it => it.x - it.w / 2)), width = Math.max(...items.map(it => it.x + it.w / 2)) - left;
  const X = k => items[k].x - left + 1, Y = k => items[k].row * ROW + 1;
  let s = `<svg width="${width + 2}" height="${rows.length * ROW - ROW + H + 2}">`;
  for (const path of edges) {  // down from the bottom of the operand, through each point, to the top of the node
    let d = `M${X(path[0])},${Y(path[0]) + H}`;
    for (let n = 1; n < path.length; n++) {
      const [x0, y0, x1, y1] = [X(path[n - 1]), Y(path[n - 1]) + H, X(path[n]), Y(path[n])], m = (y0 + y1) / 2;
      d += ` C${x0},${m} ${x1},${m} ${x1},${y1}` + (n < path.length - 1 ? ` L${x1},${y1 + H}` : "");
    }
    s += `<path d="${d}"/>`;
  }
  nodes.forEach(([label, detail, srcs], i) => {
    const fill = !srcs.length ? "#222" : label == "matmul" ? "#1d3047" : /^(sum|max)\d$/.test(label) ? "#33244a" : "#1f3a33";
    s += `<rect x="${X(i) - items[i].w / 2}" y="${Y(i)}" width="${items[i].w}" height="${H}" rx="4" fill="${fill}" stroke="${i == nodes.length - 1 ? "#aaa" : "#444"}"/>` +
      (detail ? `<text x="${X(i)}" y="${Y(i) + 15}">${esc(label)}</text><text class="dim" x="${X(i)}" y="${Y(i) + 29}">${esc(detail)}</text>`
              : `<text x="${X(i)}" y="${Y(i) + 22}">${esc(label)}</text>`);
  });
  return s + "</svg>";
}

// The timeline: one launch runs at a time, so it's one lane of bars. Scroll to zoom, drag to pan, double-click to see it all.
const canvas = $("timeline"), cx = canvas.getContext("2d"), TOP = 24;
const at = px => view[0] + px / canvas.clientWidth * (view[1] - view[0]);
function draw() {
  const W = canvas.clientWidth, H = canvas.clientHeight, r = devicePixelRatio;
  canvas.width = W * r; canvas.height = H * r; cx.setTransform(r, 0, 0, r, 0, 0);
  const span = view[1] - view[0], X = t => (t - view[0]) / span * W, step = 10 ** Math.floor(Math.log10(span / 6));
  const tick = [1, 2, 5, 10].map(m => m * step).find(t => span / t <= 8);
  cx.font = "11px ui-monospace, Menlo, Consolas, monospace"; cx.fillStyle = "#8a8a8a"; cx.strokeStyle = "#2a2a2a";
  for (let t = Math.ceil(view[0] / tick) * tick; t <= view[1]; t += tick) {
    cx.beginPath(); cx.moveTo(X(t) + 0.5, TOP - 6); cx.lineTo(X(t) + 0.5, H); cx.stroke(); cx.fillText(num(Math.round(t)), X(t) + 4, 14);
  }
  for (const [k, , t, cycles] of run.launches) {
    const x0 = X(t), x1 = X(t + cycles);
    if (x1 < 0 || x0 > W) continue;
    cx.fillStyle = color(k, picked == null || picked == k ? 0.95 : 0.22);
    cx.fillRect(x0, TOP, Math.max(1, x1 - x0 - (x1 - x0 > 3)), H - TOP - 8);  // a 1-pixel gap between bars wide enough for one
  }
}
const under = px => {  // the launch under a point of the timeline, by binary search on start times
  const t = at(px), l = run.launches;
  let lo = 0, hi = l.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (l[m][2] <= t) lo = m; else hi = m - 1; }
  const slack = (view[1] - view[0]) / canvas.clientWidth;  // a bar is at least a pixel wide
  return l[lo] && t >= l[lo][2] && t <= l[lo][2] + Math.max(l[lo][3], slack) ? l[lo] : null;
};
let drag = null;
canvas.onwheel = e => {
  e.preventDefault();
  const t = at(e.offsetX), f = Math.max(Math.exp(e.deltaY * 0.0015), 10 / (view[1] - view[0]));  // no closer than 10 cycles across
  view = [t - (t - view[0]) * f, t + (view[1] - t) * f];
  draw();
};
canvas.onmousedown = e => drag = { x: e.clientX, view: [...view], moved: false };
onmouseup = e => {
  if (drag && !drag.moved && e.target == canvas) { const l = under(e.offsetX); if (l) pick(l[0]); }
  drag = null;
};
onmousemove = e => {
  const tip = $("tip");
  if (drag && e.buttons) {  // clientX, since the pointer can leave the canvas while it drags
    const dt = (e.clientX - drag.x) / canvas.clientWidth * (drag.view[1] - drag.view[0]);
    drag.moved ||= Math.abs(e.clientX - drag.x) > 2;
    if (drag.moved) { view = drag.view.map(v => v - dt); draw(); }
  }
  const l = run && e.target == canvas && under(e.offsetX);
  if (!l) { tip.style.display = "none"; return; }
  tip.innerHTML = `launch ${l[1]}: ${esc(run.kernels[l[0]].name || "(no name)")}<br><span class="dim">${num(l[3])} cycles on ${l[5]} worker${l[5] > 1 ? "s" : ""}` +
    `${l[4] != null ? `, ${num(l[4])} bytes read` : ""}</span>`;
  tip.style.display = "block";  // shown before it's measured, so offsetWidth is its width
  Object.assign(tip.style, { left: Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 4) + "px", top: e.clientY + 14 + "px" });
};
const whole = () => { const l = run.launches.at(-1); view = [0, Math.max(1, l ? l[2] + l[3] : 1)]; };
canvas.ondblclick = () => { if (run) whole(), draw(); };
onresize = () => run && draw();  // keeps the zoom
if (runs.length) show(0);
else $("kernel").innerHTML = "<p>There are no launches in this page. viz.py fills in this template: run a script with " +
  "<code>python3 -m baretile.viz script.py</code> and open the viz.html that it writes.</p>";
</script>
