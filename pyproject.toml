[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baretile"
version = "0.0.1"
description = "A compiler and runtime for Tenstorrent Blackhole, written in Python"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "alkinun" }]
classifiers = ["Operating System :: POSIX :: Linux"]

[project.urls]
Source = "https://github.com/baretile/baretile"

# Name the namespace package explicitly because baretile/ has no __init__.py. The sdist includes only this package.
[tool.hatch.build.targets.wheel]
packages = ["baretile"]

[tool.hatch.build.targets.sdist]
only-include = ["baretile"]
